<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form class="location-form">
        <label for="location-input">Location: </label>
        <input type="text" id="location-input" required>

        <input type="radio" id="farenheit" name="temp-unit" value="f" checked>
        <label for="farenheit-option">Farenheit</label>

        <input type="radio" id="celsius" name="temp-unit" value="c">
        <label for="celsius-option">Celsius</label>

        <button class="submit-button">Submit</button>
    </form>
    <div class="weather-data"></div>
</body>
</html>
